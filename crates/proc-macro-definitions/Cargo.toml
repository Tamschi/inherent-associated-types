[package]
name = "inherent-associated-types_proc-macro-definitions"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Macro definitions for inherent-associated-types."
authors.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
syn = { version = "3.0.9", default-features = false, features = [
	"full",
	"parsing",
	"printing",
	"proc-macro",
] }
